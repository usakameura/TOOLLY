<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img" aria-labelledby="title desc">
<title id="title">toolly — つくる時間を、もっと気軽に。</title><desc id="desc">A crafted editorial style hero for Toolly, an approachable tool rental service, with a warm workshop still life.</desc>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>toolly｜工具レンタル</title>
<meta name="description" content="つくる時間を、もっと気軽に。必要な道具を、必要な日だけレンタル。Webで予約・利用規約の同意と署名まで完結。">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#fbfaf6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#fbfaf6;--card:#ffffff;--soft:#f3f2ec;--sage:#e7eeeb;--wood:#d8c9b0;
  --line:rgba(38,58,66,.09);--line2:rgba(38,58,66,.17);
  --text:#263a42;--text2:#4b5f66;--muted:#637578;
  --teal:#3f5d6a;--teal2:#547584;--teal-l:#e4eded;--teal-ll:#f1f5f4;
  --coral:#e28b63;--coral-d:#b5532c;--coral-l:#fbe8dd;
  --ok:#2f7a55;--ok-l:#e6f2eb;--ng:#b42318;--ng-l:#fdecea;--warn:#a15c07;
  --shadow:0 1px 2px rgba(38,58,66,.05),0 8px 24px rgba(53,73,80,.07);
  --shadow2:0 2px 4px rgba(38,58,66,.06),0 18px 40px rgba(53,73,80,.12);
  --hd:62px;--r:18px;
  --sans:'Inter','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.75;min-height:100vh;overflow-x:hidden;font-feature-settings:"palt" 1}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(88,107,101,.03) 0 1px,transparent 1px 43px)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px}
img{max-width:100%;display:block}
.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* header */
.hd{position:sticky;top:0;z-index:50;height:var(--hd);display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:rgba(251,250,246,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;flex-shrink:0}
.logo-txt{font-family:'Inter',sans-serif;font-size:23px;font-weight:800;letter-spacing:.06em;line-height:1;color:#263c46;position:relative;padding-right:10px}
.logo-txt::after{content:"";position:absolute;right:0;top:0;width:6px;height:6px;border-radius:50%;background:var(--coral)}
.logo-sub{font-size:10px;letter-spacing:.18em;color:#859795;font-weight:600;margin-left:6px}
.cart-btn{position:relative;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line2);color:var(--text);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--coral-d);color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;padding:0 5px}
.badge.on{display:grid}

main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 18px 120px;min-height:70vh}
.page{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fu{opacity:0;animation:fadeUp .6s ease forwards}

/* hero（ヘッダー画像と同じ構図） */
.hero{position:relative;margin:18px 0 26px;border-radius:26px;overflow:hidden;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);align-items:stretch;
  background:linear-gradient(135deg,#fbfaf6 0%,#f2f2eb 55%,#e7eeeb 100%);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-copy{padding:56px 0 52px 52px;position:relative;z-index:1}
.hero-tag{font-size:11px;letter-spacing:.22em;color:#859795;font-weight:600}
.hero h1{font-size:clamp(34px,4.6vw,54px);font-weight:800;line-height:1.28;letter-spacing:-.02em;color:#263a42;margin:18px 0 0}
.hero .rule{width:60px;height:3px;border-radius:2px;background:var(--coral);margin:26px 0 22px}
.hero p{color:var(--muted);font-size:17px;line-height:1.85}
.hero-cta{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.hero-art{position:relative;min-height:100%}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left bottom}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:14px 26px;font-weight:700;font-size:15px;transition:transform .12s,opacity .15s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--teal);color:#fff;box-shadow:0 6px 18px rgba(63,93,106,.28)}
.btn-gold:hover{background:#355260}
.btn-ghost{background:#fff;color:var(--text);border:1px solid var(--line2)}
.btn-block{width:100%}
.btn[disabled]{opacity:.38;pointer-events:none;box-shadow:none}

.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 44px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.feat b{display:block;font-size:15px;margin:12px 0 4px}
.feat span{font-size:13px;color:var(--muted)}
.feat .ic{width:42px;height:42px;border-radius:13px;background:var(--coral-l);color:var(--coral-d);display:grid;place-items:center}

.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:40px 0 16px}
.sec-h .en{display:block;font-size:11px;letter-spacing:.22em;color:var(--coral-d);font-weight:700}
.sec-h h2{font-size:24px;font-weight:800;line-height:1.35;letter-spacing:-.01em;color:#263a42;margin-top:4px}
.sec-h small{color:var(--muted);font-size:12px}

.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;counter-reset:f}
.flow div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.flow div::before{counter-increment:f;content:counter(f,decimal-leading-zero);display:block;font-family:'Inter',sans-serif;font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--coral-d);margin-bottom:6px}

/* filters */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;position:sticky;top:var(--hd);z-index:10;background:linear-gradient(var(--bg) 82%,rgba(251,250,246,0));padding:10px 0 12px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:999px;padding:0 16px;box-shadow:var(--shadow)}
.search input{flex:1;background:transparent;border:none;color:var(--text);padding:12px 0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line2);background:#fff;color:var(--text2);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.thumb{aspect-ratio:1/1;background:linear-gradient(160deg,#f3f2ec,#e7eeeb);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(84,117,132,.4)}
.tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 9px;border-radius:999px}
.tag-sale{background:var(--coral-d);color:#fff}
.card-b{padding:13px 14px 15px;display:flex;flex-direction:column;gap:3px;flex:1}
.card-cat{font-size:11px;color:var(--coral-d);font-weight:700;letter-spacing:.08em}
.card-n{font-weight:700;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-p{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.card-p b{font-family:'Inter',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1;color:#263a42}
.card-p s{color:var(--muted);font-size:12px}
.card-p span{font-size:11px;color:var(--muted)}
.empty{padding:50px 10px;text-align:center;color:var(--muted)}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin:18px 0 12px;background:none;border:none}
.dt{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:start}
.gal{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#f3f2ec,#e7eeeb);box-shadow:var(--shadow)}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-track>div{flex:0 0 100%;aspect-ratio:1/1;scroll-snap-align:start;display:grid;place-items:center;color:rgba(84,117,132,.4)}
.gal-track img{width:100%;height:100%;object-fit:cover}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(38,58,66,.22)}
.dots i.on{background:var(--coral)}
.dt h1{font-size:23px;font-weight:800;line-height:1.45;margin:6px 0 4px;letter-spacing:-.01em}
.dt .sub{color:var(--muted);font-size:13px}
.price-tbl{margin:16px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.price-tbl div{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.price-tbl div:last-child{border-bottom:none}
.price-tbl b{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:#263a42;letter-spacing:-.02em}
.price-tbl s{color:var(--muted);font-size:13px;margin-right:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.box-t{font-weight:800;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.box-t::before{content:"";width:18px;height:3px;background:var(--coral);border-radius:2px}
.pre{white-space:pre-wrap;font-size:14px;color:var(--text2)}
.pre-box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:15px}
.cal-nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:#fff;color:var(--text);font-size:18px}
.cal-nav[disabled]{opacity:.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cal .wd:first-child{color:var(--coral-d)}.cal .wd:last-child{color:var(--teal2)}
.cd{aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;background:var(--teal-ll);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.1;padding:0;font-family:'Inter',sans-serif}
.cd small{font-size:10px;margin-top:2px;font-weight:800}
.cd.ok small{color:var(--ok)}.cd.few small{color:var(--warn)}.cd.ng small{color:var(--ng)}
.cd.ng{opacity:.5}
.cd.off{opacity:.3;pointer-events:none;background:transparent}
.cd.blank{visibility:hidden}
.cd.in{background:var(--teal-l);border-color:#c9dadb}
.cd.edge{background:var(--teal);color:#fff;font-weight:800;box-shadow:0 3px 10px rgba(63,93,106,.35)}
.cd.edge small{color:#fff}
.cd.buf{background:repeating-linear-gradient(135deg,rgba(226,139,99,.22) 0 4px,var(--teal-ll) 4px 8px)}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.msg{font-size:13px;padding:10px 14px;border-radius:12px;margin-top:10px}
.msg-ok{background:var(--ok-l);color:#1f5c3f;border:1px solid #c5e1d1}
.msg-ng{background:var(--ng-l);color:#8a1c12;border:1px solid #f6c9c3}
.msg-info{background:var(--coral-l);color:#7c3a1d;border:1px solid #f5d0bc}

.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:#fff}
.qty button{width:40px;height:40px;background:transparent;border:none;color:var(--text);font-size:18px}
.qty span{min-width:30px;text-align:center;font-weight:800;font-family:'Inter',sans-serif}
.est{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.est b{font-family:'Inter',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em;color:#263a42;line-height:1}

.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(53,73,80,.07)}
.sticky-cta .in{max-width:1120px;margin:0 auto;display:flex;gap:12px;align-items:center}
.sticky-cta .sum{flex:1;min-width:0}
.sticky-cta .sum small{display:block;font-size:11px;color:var(--muted)}
.sticky-cta .sum b{font-family:'Inter',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.02em;color:#263a42;line-height:1.1}

/* steps */
.steps{display:flex;gap:6px;margin:22px 0 18px}
.steps div{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.steps div i{display:block;height:4px;border-radius:2px;background:rgba(38,58,66,.1);margin-bottom:6px}
.steps div.on{color:var(--teal)}.steps div.on i{background:var(--teal)}
.steps div.done i{background:#9fb6bd}
.ttl{font-size:21px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}

.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:none}
.line .im{width:64px;height:64px;border-radius:12px;overflow:hidden;flex-shrink:0;background:linear-gradient(160deg,#f3f2ec,#e7eeeb);display:grid;place-items:center;color:rgba(84,117,132,.4)}
.line .im img{width:100%;height:100%;object-fit:cover}
.line .nm{font-weight:700;font-size:14px;line-height:1.4}
.line .meta{font-size:12px;color:var(--muted)}
.line .rm{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline}
.ok-tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;display:inline-block;margin-top:4px;background:var(--soft);color:var(--muted)}
.ok-tag.y{background:var(--ok-l);color:#1f5c3f}.ok-tag.n{background:var(--ng-l);color:#8a1c12}

.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.row.tot{border-top:1px solid var(--line2);margin-top:6px;padding-top:12px;font-weight:800}
.row.tot b{font-family:'Inter',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.02em;color:#263a42;line-height:1}
.ship-note{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--text2)}
.ship-note .ic{width:40px;height:40px;border-radius:12px;background:var(--coral-l);color:var(--coral-d);display:grid;place-items:center;flex-shrink:0}

.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.fg label em{font-style:normal;color:var(--coral-d);font-size:11px;margin-left:6px}
.inp{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:12px;color:var(--text);padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(84,117,132,.16)}
.inp.err{border-color:var(--ng)}
.err-t{color:var(--ng);font-size:12px;margin-top:4px;display:none}
.err-t.on{display:block}
.dates{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
input[type=date].inp{color-scheme:light}

/* consent (ZELI方式) */
.terms{max-height:280px;overflow-y:auto;background:var(--soft);border:1px solid var(--line2);border-radius:14px;padding:16px;font-size:13px;line-height:1.9;white-space:pre-wrap;color:var(--text2)}
.terms-note{font-size:12px;color:var(--muted);margin:8px 2px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:15px 14px;border:1.5px solid var(--line2);border-radius:14px;margin-bottom:10px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
.chk input{width:22px;height:22px;flex-shrink:0;accent-color:var(--teal);cursor:pointer;margin-top:1px}
.chk span{font-size:15px;line-height:1.65;font-weight:600}
.chk.on{border-color:#9fb6bd;background:var(--teal-ll)}
.chk.dis{opacity:.45;pointer-events:none}
.sig-wrap{border:2px dashed #e9b497;border-radius:16px;background:#fff;padding:6px}
.sig-wrap canvas{width:100%;height:200px;display:block;touch-action:none;border-radius:10px;background:#fff;cursor:crosshair}
.sig-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:8px 4px 0}

.done{text-align:center;padding:30px 0}
.done .mk{width:76px;height:76px;border-radius:50%;margin:0 auto 16px;background:var(--teal);display:grid;place-items:center;color:#fff;box-shadow:0 10px 26px rgba(63,93,106,.35);animation:pop .5s ease both}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.onum{font-family:'Inter',sans-serif;font-size:28px;font-weight:800;letter-spacing:.04em;color:#263a42}

.ft{position:relative;z-index:1;border-top:1px solid var(--line);padding:30px 16px 44px;text-align:center;color:var(--muted);font-size:12px;background:var(--sage)}
.ft a{margin:0 10px;text-decoration:underline}
.ft .ft-logo{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;background:#263a42;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:100;transition:.25s;max-width:calc(100% - 32px);text-align:center;pointer-events:none;box-shadow:var(--shadow2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--ng)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid rgba(38,58,66,.1);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .dt{grid-template-columns:1fr;gap:16px}
  .feats{grid-template-columns:1fr}
  .flow{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .flow div{padding:10px 4px;font-size:11px}
  .hero{grid-template-columns:1fr;margin-top:12px;border-radius:22px}
  .hero-copy{padding:34px 24px 6px}
  .hero h1{font-size:34px}
  .hero p{font-size:15px}
  .hero-art{aspect-ratio:960/620;min-height:0}
  .hero-art img{object-position:center bottom}
  .logo-sub{display:none}
}
</style>
</head>
<body>
<header class="hd">
  <a href="#/" class="logo">
    <svg class="logo-mark" viewBox="0 6 42 30" aria-hidden="true"><path d="M2 8h25l13 13-13 13H2z" fill="#547584"/><path d="M13 8v26" stroke="#f8f7f0" stroke-width="4"/></svg>
    <span class="logo-txt" id="store-name">toolly</span><span class="logo-sub">TOOLS, WHEN YOU NEED THEM</span>
  </a>
  <a href="#/cart" class="cart-btn" aria-label="カート">

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function ssGet(k, d) { try { const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function setI(k, def) { const v = parseInt(S.settings[k], 10); return Number.isFinite(v) ? v : def; }

/* ───────── 日付（日本時間・YYYY-MM-DD） ───────── */
const DAY = 86400000;
const WD = ['日', '月', '火', '水', '木', '金', '土'];
function todayJST() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function d2n(s) { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); }
function n2d(n) { return new Date(n * DAY).toISOString().slice(0, 10); }
function addD(s, k) { return n2d(d2n(s) + k); }
function diffD(a, b) { return d2n(b) - d2n(a); }
function isDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && n2d(d2n(s)) === s; }
function jpD(s) { const n = d2n(s); const d = new Date(n * DAY); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`; }
function rule() {
  const t = todayJST();
  return {
    today: t, minStart: addD(t, setI('lead_days', 2)), maxStart: addD(t, 180),
    minDays: Math.max(setI('min_days', 1), 1), maxDays: Math.max(setI('max_days', 30), 1), buf: Math.max(setI('buffer_days', 1), 0),
  };
}

}

/* ───────── 料金 ───────── */
const firstPrice = (it) => (it.sale_price_day != null ? it.sale_price_day : it.price_day);
function lineCalc(it, qty, days) {
  const unit = firstPrice(it) + it.price_extra_day * Math.max(days - 1, 0);
  return { unit, line: unit * qty, dep: it.deposit * qty };
}
function periodInfo(start, end) {
  const R = rule();
  if (!isDate(start) || !isDate(end)) return { ok: false, msg: 'ご利用期間を選んでください' };
  if (end < start) return { ok: false, msg: '返却日は利用開始日以降にしてください' };
  if (start < R.minStart) return { ok: false, msg: `利用開始日は ${jpD(R.minStart)} 以降を選んでください` };
  if (start > R.maxStart) return { ok: false, msg: '予約は180日先までです' };
  const days = diffD(start, end) + 1;
  if (days < R.minDays || days > R.maxDays) return { ok: false, msg: `ご利用日数は ${R.minDays}〜${R.maxDays}日です`, days };
  return { ok: true, days };
}
function cartCalc() {
  const p = periodInfo(cart.start, cart.end);
  const days = p.ok ? p.days : 1;
  let sub = 0, dep = 0;
  const lines = cart.items.map((x) => { const it = itemById(x.id); const c = lineCalc(it, x.qty, days); sub += c.line; dep += c.dep; return { ...x, it, ...c }; });
  const ship = cart.items.length ? setI('shipping_fee', 0) : 0;
  return { p, days, lines, sub, dep, ship, total: sub + dep + ship };
}

/* ───────── 空き状況 ───────── */
async function loadCal(id, force) {
  const c = S.cal[id];
  if (c && !force && Date.now() - c.at < 60000) return c;
  const t = todayJST();
  const [a, b] = await Promise.all([
    sb.rpc('get_item_calendar', { p_item: id, p_from: t, p_to: addD(t, 120) }),
    sb.rpc('get_item_calendar', { p_item: id, p_from: addD(t, 121), p_to: addD(t, 241) }),
  ]);
  if (a.error) throw a.error;
  if (b.error) throw b.error;
  const m = {};
  let stock = itemById(id)?.stock ?? 0;
  [...(a.data || []), ...(b.data || [])].forEach((r) => { m[r.day] = r.booked; stock = r.stock; });
  S.cal[id] = { m, stock, at: Date.now() };
  return S.cal[id];
}
function freeOn(id, day) { const c = S.cal[id]; if (!c) return 0; return c.stock - (c.m[day] || 0); }
/* 期間＋返却後の点検日数ぶん、qty台ずつ空いているか */
function rangeFree(id, qty, start, end) {
  const R = rule();
  let min = Infinity;
  for (let d = start; d <= addD(end, R.buf); d = addD(d, 1)) min = Math.min(min, freeOn(id, d));
  return { ok: min >= qty, left: Math.max(min === Infinity ? 0 : min, 0) };
}

/* ───────── 商品詳細＋カレンダー ───────── */
const D = { id: '', qty: 1, month: '', start: '', end: '', pending: false };
async function pgItem(id) {

  const cat = S.cats.find((c) => c.id === it.category_id);

      <div class="price-tbl">

        <div><span>2日目以降（1日あたり）</span><b>${yen(it.price_extra_day)}</b></div>

function drawCal() {
  const it = itemById(D.id); if (!it || !$('#cal-box') || !S.cal[D.id]) return;
  const R = rule();
  const first = D.month; const y = +first.slice(0, 4); const mo = +first.slice(5, 7);
  const startW = new Date(Date.UTC(y, mo - 1, 1)).getUTCDay();
  const dim = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const lastSel = addD(R.maxStart, R.maxDays);
  const minMonth = R.today.slice(0, 8) + '01';
  const maxMonth = lastSel.slice(0, 8) + '01';
  const hasRange = D.start && D.end && !D.pending;
  let cells = ['日', '月', '火', '水', '木', '金', '土'].map((w) => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < startW; i++) cells += '<div class="cd blank"></div>';
  for (let d = 1; d <= dim; d++) {
    const ds = `${first.slice(0, 8)}${String(d).padStart(2, '0')}`;
    const free = freeOn(D.id, ds);
    let cls = 'cd', mark = '';
    const inStartRange = ds >= R.minStart && ds <= R.maxStart;
    const selectable = D.pending ? ((ds >= D.start && ds <= addD(D.start, R.maxDays - 1)) || (inStartRange && ds < D.start)) : inStartRange;
    if (ds < R.today || ds > lastSel || !selectable) cls += ' off';
    else if (free >= D.qty) { cls += ' ok'; mark = '○'; }
    else if (free > 0) { cls += ' few'; mark = '△'; }
    else { cls += ' ng'; mark = '×'; }
    if (D.start && ((hasRange && ds >= D.start && ds <= D.end) || ds === D.start)) cls += (ds === D.start || ds === D.end) ? ' edge' : ' in';
    else if (hasRange && R.buf && ds > D.end && ds <= addD(D.end, R.buf)) cls += ' buf';
    cells += `<button class="${cls}" data-d="${ds}">${d}<small>${mark}</small></button>`;
  }
  $('#cal-box').innerHTML = `
    <div class="cal-h"><button class="cal-nav" id="c-prev" ${first <= minMonth ? 'disabled' : ''}>‹</button><b>${y}年${mo}月</b><button class="cal-nav" id="c-next" ${first >= maxMonth ? 'disabled' : ''}>›</button></div>

/* 署名パッド（汎用） */
const PADS = {};
function initSigPad(id) {
  const cv = document.getElementById(id); if (!cv) return;
  const r = cv.getBoundingClientRect();
  if (!r.width) { setTimeout(() => initSigPad(id), 80); return; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  const st = { len: 0, down: false, last: null, w: r.width };
  PADS[id] = st;
  const pos = (e) => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  cv.onpointerdown = (e) => {
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    st.down = true; st.last = pos(e);
    ctx.beginPath(); ctx.arc(st.last.x, st.last.y, 1.2, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill();
  };
  cv.onpointermove = (e) => {
    if (!st.down) return; e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(st.last.x, st.last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    st.len += Math.hypot(p.x - st.last.x, p.y - st.last.y); st.last = p;
  };
  cv.onpointerup = cv.onpointercancel = cv.onpointerleave = () => { if (st.down) { st.down = false; updConsentBtn(); } };
}
function sigPadDrawn(id) { return !!PADS[id] && PADS[id].len > 60; }
function sigDataURL(id) {
  const cv = document.getElementById(id);
  const w = Math.min(800, cv.width), h = Math.round(cv.height * w / cv.width);
  const o = document.createElement('canvas'); o.width = w; o.height = h;
  const c = o.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); c.drawImage(cv, 0, 0, w, h);
  return o.toDataURL('image/png');
}
let _resizeT;
window.addEventListener('resize', () => {
  clearTimeout(_resizeT);
  _resizeT = setTimeout(() => {
    const cv = $('#sig'); const st = PADS.sig;
    if (cv && st && Math.abs(cv.getBoundingClientRect().width - st.w) > 2) { initSigPad('sig'); updConsentBtn(); toast('画面サイズが変わったため、署名をもう一度お願いします'); }
  }, 250);
});

    sb.functions.invoke('send-mail', { body: { type: 'order', order_id: data.id, token: data.token } })
      .then(({ error: e }) => { if (e) console.warn('mail', e); }).catch((e) => console.warn('mail', e));
    ssSet(DONE_KEY, { order_number: data.order_number, total: data.total, start: cart.start, end: cart.end, email: cust.email });
    cart = { items: [], start: '', end: '' }; saveCart();
    try { sessionStorage.removeItem(CUST_KEY); } catch (e) {}
    S.cal = {};
    location.hash = '#/done';
  } catch (e) {
    console.error(e);
    toast(e.message || '予約できませんでした', true);
    btn.textContent = '✅ 同意・署名して予約を確定'; updConsentBtn();
  } finally { _submitting = false; }
}

/* ───────── 完了 ───────── */
function pgDone() {
  const d = ssGet(DONE_KEY, null);
  if (!d) { location.hash = '#/'; return; }
  const days = setI('auto_cancel_days', 0);
  setApp(`${steps(4)}
  <div class="done">
    <div class="mk"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <div class="ttl">ご予約ありがとうございます</div>
    <div style="color:var(--muted);font-size:13px">予約番号</div>
    <div class="onum">${esc(d.order_number)}</div>
    <div style="font-size:13px;color:var(--text2);margin-top:6px">${esc(d.email)} に確認メールをお送りしました。</div>
  </div>
  <div class="box">
    <div class="row"><span>ご利用期間</span><span>${jpD(d.start)} 〜 ${jpD(d.end)}</span></div>
    <div class="row tot"><span>お支払い合計</span><b>${yen(d.total)}</b></div>
  </div>
  <div class="box"><div class="box-t">お支払い（銀行振込）</div>
    <div class="pre pre-box">${esc(S.settings.bank_info || '')}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">振込名義の前に予約番号の数字（${esc(String(d.order_number).replace(/\D/g, '').slice(-6))}）をご入力ください。${days > 0 ? `<br>${days}日以内にご入金が確認できない場合、ご予約は自動でキャンセルされます。` : ''}</div>
  </div>
  <div style="text-align:center;margin-top:24px"><a class="btn btn-ghost" href="#/">トップへ戻る</a></div>`);
}

/* ───────── 利用規約ページ ───────── */
function pgTerms() {
  const items = importantItems();
  setApp(`<button class="back" onclick="location.hash='#/'">‹ トップへ</button>
  <div class="ttl">利用規約</div>
  <div class="box"><div class="pre">${esc(S.settings.terms_text || '')}</div></div>
  ${items.length ? `<div class="box"><div class="box-t">ご予約時に確認いただく事項</div><ul style="padding-left:20px;font-size:14px;color:var(--text2)">${items.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}`);
}

boot();
</script>
</body>
</html>
